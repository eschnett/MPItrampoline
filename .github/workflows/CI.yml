name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v5
    - name: shellcheck
      run: shellcheck --exclude SC2086 bin/*
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-13, macos-14]
        fortran: [fortran-off, fortran-on]
        shared: [shared-off, shared-on]
        build_type: [Debug, Release]

    runs-on: ${{matrix.os}}

    steps:
    - uses: actions/checkout@v4

    - name: Configure
      run: |
        fortran=$(echo ${{matrix.fortran}} | sed -e 's/fortran-//')
        shared=$(echo ${{matrix.shared}} | sed -e 's/shared-//')
        export CFLAGS="-Wall"
        export CXXFLAGS="-Wall"
        case $RUNNER_OS in
        Linux)
            cmake -B ${{github.workspace}}/build \
                -DCMAKE_COMPILE_WARNING_AS_ERROR=ON \
                -DENABLE_FORTRAN=${fortran} \
                -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
                -DBUILD_SHARED_LIBS=${shared} \
                -DCMAKE_INSTALL_PREFIX=$HOME/mpitrampoline
            ;;
        macOS)
            # Use GCC-14 from Homebrew
            cmake -B ${{github.workspace}}/build \
                -DCMAKE_COMPILE_WARNING_AS_ERROR=ON \
                -DENABLE_FORTRAN=${fortran} \
                -DCMAKE_C_COMPILER=gcc-14 \
                -DCMAKE_CXX_COMPILER=g++-14 \
                -DCMAKE_Fortran_COMPILER=gfortran-14 \
                -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
                -DBUILD_SHARED_LIBS=${shared} \
                -DCMAKE_INSTALL_PREFIX=$HOME/mpitrampoline
            ;;
        esac

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{ matrix.build_type }} --verbose

    - name: Test
      working-directory: ${{github.workspace}}/build
      run: ctest -C ${{ matrix.build_type }}

    - name: Install
      run: cmake --install ${{github.workspace}}/build --config ${{ matrix.build_type }}
